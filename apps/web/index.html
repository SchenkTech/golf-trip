<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2545" />
    <!-- Installed-to-home-screen behavior on iOS, which ignores the
         manifest's own display:standalone for these specifics. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS home-screen label. The trip's own short name belongs in
         public/manifest.webmanifest (a branding asset); this is the
         fallback for the seconds before it's read. -->
    <meta name="apple-mobile-web-app-title" content="Golf" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
    <!-- Replaced at runtime with the event's own name once the Board has
         it (src/App.tsx), so no trip name is baked into the build. -->
    <title>Golf Trip</title>
    <script>
      // Applied before anything paints, so a stored light/dark choice never
      // flashes the wrong theme for a frame -- see src/lib/theme.ts, which
      // owns this same logic for every change made after the first paint.
      try {
        var t = localStorage.getItem("gc:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
